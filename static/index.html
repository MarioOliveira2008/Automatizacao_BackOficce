<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEMADA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Bem-vindo ao HEMADA</h1>
        <p>Aqui você organiza documentos de forma simples e eficiente.</p>

        <form id="enviarArquivo">
            <input type="file" id="arquivo" accept="application/pdf" required>
            <button type="submit">Enviar e Analisar</button> 
        </form>

        <p id="mensagem"></p>
        
        <div id="resultado" style="display: none; background: #eee; padding: 10px; margin-top: 15px;">
            <p><strong>Páginas lidas:</strong> <span id="paginas"></span></p>
            <p><strong>Resumo da IA:</strong> <span id="resumo"></span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
