<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEMADA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Bem-vindo ao HEMADA</h1>
        <p class="subtitle">Aqui você organiza documentos de forma simples e eficiente.</p>

        <form id="enviarArquivo" class="upload-form">
            <input type="file" id="arquivo" accept="application/pdf" required>
            <button type="submit">Enviar e Analisar</button> 
        </form>

        <p id="mensagem"></p>
        
        <div id="resultado" style="display: none; background: #1f2330; padding: 20px; margin-top: 15px; border-radius: 15px; border: 1px solid #2d3448;">
            <p style="margin-bottom: 10px;"><strong>Páginas lidas:</strong> <span id="paginas"></span></p>
            <p><strong>Resumo da IA:</strong> <span id="resumo"></span></p>
        </div>

        <div style="margin-top: 30px; background: #171923; padding: 20px; border-radius: 15px; border: 1px solid #252836;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2>Histórico de Análises</h2>
                <button onclick="limparHistorico()" style="background: #ef4444; padding: 10px 15px; border: none; border-radius: 10px; color: white; cursor: pointer;">Limpar Banco</button>
            </div>
            <div id="historico"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
